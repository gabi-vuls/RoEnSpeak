[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roenspeak"
version = "0.1.0"
description = "Speak Romanian, type English: system-wide dictation, with faster-whisper on CUDA (Windows) or whisper.cpp on Metal (macOS)"
requires-python = ">=3.11"
# Platform-split on purpose. The two ports share the UI, the audio front end and the VAD, but not
# the speech engine, so the engine dependencies carry environment markers. `pip install .` resolves
# to exactly the Windows set it always did on win32, and to the macOS set on darwin.
# The real, verified pins live in requirements.txt (Windows x64) and requirements-macos.txt
# (macOS arm64); the ranges below are only package metadata.
dependencies = [
    # --- both platforms ---
    "PySide6-Essentials>=6.8",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "onnxruntime>=1.20",      # Silero VAD
    "huggingface_hub>=0.30",  # model downloads
    "numpy>=1.26",
    # --- Windows: faster-whisper / CTranslate2 on CUDA ---
    "faster-whisper; sys_platform == 'win32'",
    "ctranslate2>=4.5,<5; sys_platform == 'win32'",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32'",
    "nvidia-ml-py>=12; sys_platform == 'win32'",
    # --- macOS: whisper.cpp on Metal ---
    # Nothing to list. The engine is built from source by native/whispercpp/build.sh (whisper.cpp
    # v1.9.5 + a C shim) and loaded with ctypes, so it is not a Python distribution. faster-whisper,
    # ctranslate2 and every nvidia-* wheel are deliberately absent on darwin; see
    # requirements-macos.in for why.
]

[project.scripts]
roenspeak-cli = "app.cli:main"

[project.gui-scripts]
roenspeak = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every hardware/desktop marker is excluded by default, so a bare `pytest` stays hardware-free on
# both platforms. Opt in with `-m <marker>`.
addopts = "-ra -m \"not gpu and not mic and not desktop and not metal and not llm\""
markers = [
    "gpu: needs an NVIDIA GPU with CUDA + a downloaded model (run with -m gpu)",
    "mic: needs a real microphone and a human speaking (run with -m mic)",
    "desktop: needs an interactive desktop session; injects real keystrokes (Windows: SendInput; macOS: CGEvent + an Accessibility grant) (run with -m desktop)",
    "metal: needs an Apple Silicon Mac with the whisper.cpp dylibs built and a downloaded ggml model (run with -m metal)",
    "llm: needs a running Ollama with the configured prompt model pulled (ollama pull qwen2.5-coder:14b) (run with -m llm)",
]
